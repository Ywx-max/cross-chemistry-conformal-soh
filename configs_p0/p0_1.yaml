# P0-1 不确定性基线（MC dropout / deep ensemble / quantile regression）
backbone: tcn            # 论文迁移骨干（单骨干口径）
target_domains: [CALCE, NASA]
seeds: [42, 43, 44, 45, 46]
split: {calce: [7,2,7], nasa: [2,1,1]}   # 与 t4_conformal_local.py v1.2.4 一致
window: 20
horizon: 10
alpha: 0.10
mc_dropout: {p: 0.1, samples: 30, interval: normal_approx}
deep_ensemble: {members: 5, init_seeds: [1,2,3,4,5], split_seed: 42, interval: normal_approx}
quantile_regression: {taus: [0.1, 0.9], loss: pinball_mean}
source_training: {epochs: 120, early_stopping_patience: 10, lr: 1.0e-3, batch: 256, grad_clip: 1.0}
finetune: {epochs: 60, lr: 3.0e-4}
data: 01_源文件/repo_论文/05_投稿/开源仓库/data/建模表_v3_cx2.csv
src_cache: 01_源文件/repo_论文/05_投稿/开源仓库/results_cx2/src_cache   # 标准 TCN 源模型（v1.2.4）
